[project]
name = "screenshot-editor"
version = "0.1.0"
description = "FF14 スクリーンショットを公開前に非破壊で加工するローカル Windows デスクトップアプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.7.2",
    "Pillow==10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "ruff==0.6.2",
    "black==24.8.0",
    "pre-commit==3.8.0",
    "pyinstaller==6.10.0",
]

[project.scripts]
screenshot-editor = "screenshot_editor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screenshot_editor"]

# ---- テスト設定 ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# カバレッジ判定は中核ロジック層（core/io）に限定する（team.md の測定対象スコープ特化）。
[tool.coverage.run]
source = ["screenshot_editor.core", "screenshot_editor.io"]
branch = false

[tool.coverage.report]
show_missing = true

# ---- Lint / Format ----
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, S: flake8-bandit（セキュリティ系）, UP: pyupgrade
select = ["E", "F", "I", "S", "UP", "B"]
# テストでは assert 利用と一部セキュリティ規則を緩和
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
